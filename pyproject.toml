[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vla-tidybench"
version = "0.1.0"
description = "Simulation-first pi0.5 Franka manipulation benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["msgpack>=1.0.5", "numpy>=1.26", "websockets>=11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["source/vla_tidybench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

